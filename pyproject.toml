[project]
name = "tizen-tool"
version = "0.1.0"
description = "CLI for building, re-signing, and installing Tizen web packages through Dockerized Tizen Studio."
authors = [{ name = "Ruslan Khasanshin" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "click>=8.4.2",
  "defusedxml>=0.7.1",
  "ifaddr>=0.2.0",
  "pathspec>=1.1.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "typer>=0.27.0,<0.28.0",
]

[project.scripts]
tizen-tool = "tizen_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tizen_tool"]

[tool.hatch.build.targets.sdist]
include = ["/src/tizen_tool", "/README.md", "/pyproject.toml"]

[project.urls]
Repository = "https://github.com/hu553in/tizen-tool"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "prek>=0.4.10",
  "pysentry-rs>=0.4.7",
  "ruff>=0.15.22",
  "ty>=0.0.60",
  "vulture>=2.16",
]

[tool.uv]
link-mode = "copy"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ARG",
  "PL",
  "RUF",
  "C4",
  "FA",
  "N",
  "PERF",
  "W",
  "PGH004",
  "T10",
]

[tool.ruff.lint.per-file-ignores]
"src/tizen_tool/installer_cache.py" = ["PERF203"]
"src/tizen_tool/project_files.py" = ["N817"]
"src/tizen_tool/settings.py" = ["N804"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pysentry.defaults]
fail_on = "low"

[tool.pysentry.sources]
enabled = ["pypa", "pypi", "osv"]

[tool.deptry]
known_first_party = ["tizen_tool"]

[tool.vulture]
paths = ["src"]
min_confidence = 100
sort_by_size = true
