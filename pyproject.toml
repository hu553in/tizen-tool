[project]
name = "tizen-tool"
version = "0.1.0"
description = "CLI for building, re-signing, and installing Tizen web packages through Dockerized Tizen Studio."
authors = [{ name = "Ruslan Khasanshin" }]
readme = "README.md"
requires-python = ">=3.15.0"

dependencies = [
  "click>=8.5.0",
  "defusedxml>=0.7.1",
  "ifaddr>=0.2.0",
  "pathspec>=1.1.1",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "typer>=0.27.3",
]

[project.scripts]
tizen-tool = "tizen_tool.cli:main"

[project.urls]
Repository = "https://github.com/hu553in/tizen-tool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tizen_tool"]

[tool.hatch.build.targets.sdist]
include = ["/src/tizen_tool", "/README.md", "/pyproject.toml"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "prek>=0.5.7",
  "pysentry-rs>=0.5.0",
  "ruff>=0.17.2",
  "ty>=0.0.92",
  "vulture>=2.16",
]

[tool.uv]
link-mode = "copy"

[tool.ruff]
line-length = 100

[tool.ruff.per-file-target-version]
# The Ubuntu installer uses distro Python independently of the host CLI.
"src/tizen_tool/resources/install_tizen_studio.py" = "py314"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ARG",
  "PL",
  "RUF",
  "C4",
  "FA",
  "N",
  "PERF",
  "W",
  "PGH004",
  "T10",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pysentry.defaults]
fail_on = "low"

[tool.pysentry.sources]
enabled = ["pypa", "pypi", "osv"]

[tool.deptry]
known_first_party = ["tizen_tool"]

[tool.vulture]
paths = ["src"]
min_confidence = 100
sort_by_size = true
